<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Inventaris Sekolah</title>
    <!-- CSS Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: var(--bg-gray);
            font-family: 'Inter', sans-serif;
        }
        .login-container {
            max-width: 400px;
            margin-top: 100px;
        }
    </style>
</head>
<body>

<div class="container login-container">
    <div class="card card-modern p-2">
        <div class="card-body p-4">
            <h3 class="card-title text-center fw-bold mb-4">Login Admin</h3>
            
            <!-- Tempat menampilkan Flash Messages (Sukses / Error) -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Form Login -->
            <form action="{{ url_for('auth.login') }}" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label text-muted fw-semibold">Alamat Email</label>
                    <input type="email" class="form-control" id="email" name="email" required autofocus placeholder="Masukkan email...">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label text-muted fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Masukkan password...">
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary-modern btn-modern py-2 fw-bold text-white fs-5">Login</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- JS Bootstrap 5 CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
